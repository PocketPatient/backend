name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocketpatient
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pocketpatient
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pocketpatient_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      # Gemini is mocked in tests, but the SDK client refuses to construct without a key.
      GEMINI_API_KEY: ci-dummy-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen --python 3.12

      - name: Lint
        run: uv run --with ruff==0.16.10 ruff check app/ tests/ alembic/

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pocketpatient_test"

      - name: Test
        run: uv run pytest -q
