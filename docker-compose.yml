version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pocketpatient
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:postgres@db:5432/pocketpatient
      redis_url: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery-worker:
    build: .
    command: uv run celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:postgres@db:5432/pocketpatient
      redis_url: redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: uv run celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:postgres@db:5432/pocketpatient
      redis_url: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
